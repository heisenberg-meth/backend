name: MedAssist Backend CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: viyan-info-tech/medassist-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            $REGISTRY/$IMAGE_NAME:${{ steps.image.outputs.tag }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Kubernetes
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.VPS_HOST }} << EOF
            set -e

            echo "Updating MedAssist backend..."

            kubectl set image deployment/medassist-backend \
              backend=ghcr.io/viyan-info-tech/medassist-backend:${{ steps.image.outputs.tag }} \
              -n medassist

            echo "Waiting for rollout..."

            kubectl rollout status deployment/medassist-backend \
              -n medassist \
              --timeout=180s

            echo "Checking pods..."

            kubectl get pods -n medassist

            echo "Deployment successful."
          EOF

      - name: Verify production API
        run: |
          sleep 10
          curl --fail --show-error \
            https://api.medassist.viyaninfo.com/health

          echo "Production health check passed."