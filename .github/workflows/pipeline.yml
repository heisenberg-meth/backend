name: Backend CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Pre-migration Database Backup
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "Taking a pre-migration backup using pg_dump..."
        # Extract DB details from DATABASE_URL and run pg_dump
        # Example assuming DATABASE_URL is available
        mkdir -p ./db-backups
        # pg_dump $DATABASE_URL -Fc > ./db-backups/pre-migration-$(date +%s).dump
        echo "Backup complete (stubbed in CI until Render postgres is accessible from runner)"

    - name: Run Prisma Migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Build and Deploy
      run: echo "Triggering Render deployment..."
      # Use render API or webhook here to actually deploy the backend
