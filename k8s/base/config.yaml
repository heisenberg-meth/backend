apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "viyan_db"
  REDIS_URL: "redis://redis-service:6379"
---
# FIX #01: Secrets are NO LONGER stored in this ConfigMap.
# The Secret below contains only placeholder instructions.
# ALL sensitive values (JWT_SECRET, DATABASE_URL, etc.) must be injected
# via external secret management:
#   - kubectl create secret generic viyan-secrets \
#       --from-literal=JWT_SECRET="$(openssl rand -hex 48)" \
#       --from-literal=REFRESH_SECRET="$(openssl rand -hex 48)" \
#       --from-literal=COOKIE_SECRET="$(openssl rand -hex 32)" \
#       --from-literal=ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#       --from-literal=DATABASE_URL="postgresql://..." \
#       --from-literal=REDIS_URL="redis://..."
# Then reference in your Deployment via envFrom: secretRef: name: viyan-secrets
#
# NEVER commit real secret values to source control.
# Use a secrets manager (AWS Secrets Manager, HashiCorp Vault, Kubernetes External Secrets)
# for production deployments.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
data:
  # PLACEHOLDER — Do NOT put real values here.
  # Inject secrets at deploy time via your CI/CD secrets manager.
  # Generate with: openssl rand -hex 48 | base64
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_64_CHAR_RANDOM_STRING"
  REFRESH_SECRET: "REPLACE_WITH_BASE64_ENCODED_64_CHAR_RANDOM_STRING"
  DATABASE_URL: "REPLACE_WITH_BASE64_ENCODED_DATABASE_URL"
  COOKIE_SECRET: "REPLACE_WITH_BASE64_ENCODED_COOKIE_SECRET"
  ENCRYPTION_KEY: "REPLACE_WITH_BASE64_ENCODED_64_HEX_CHAR_KEY"
