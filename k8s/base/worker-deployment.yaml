apiVersion: apps/v1
kind: Deployment
metadata:
  name: viyan-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: viyan-worker
  template:
    metadata:
      labels:
        app: viyan-worker
    spec:
      containers:
      - name: worker
        image: viyan-backend:latest
        command: ["node", "src/queue/index.js"] # Assuming the queue/index.js starts the worker
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
