# FIX #02: All secrets are loaded from a .env file (excluded from git via .gitignore).
# Copy .env.example to .env and fill in real values before running docker-compose.
# NEVER commit .env to source control.
#
# Generate secrets with:
#   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#
# Required .env values for this compose file:
#   POSTGRES_PASSWORD=<strong-password>
#   DB_PASSWORD=<same-strong-password>
#   JWT_SECRET=<64+ char random hex>
#   REFRESH_SECRET=<64+ char random hex — different from JWT_SECRET>
#   COOKIE_SECRET=<32+ char random hex>
#   ENCRYPTION_KEY=<exactly 64 hex chars = 32 bytes>
#   LOG_OTP=false

services:
  postgres:
    image: postgres:16-alpine
    container_name: ims_postgres

    environment:
      POSTGRES_USER: viyan_user
      # FIX #02: Password loaded from .env — not hardcoded
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: viyan_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - viyan-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viyan_user -d viyan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction

    ports:
      - "6379:6379"

    networks:
      - viyan-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production

    environment:
      NODE_ENV: production
      PORT: 5000
      # FIX #02: All secrets use env var substitution — values come from .env file
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # FIX #03/#15: OTP logging must be off in production
      LOG_OTP: "false"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads

    networks:
      - viyan-network

    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      target: production

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}

    depends_on:
      - backend

    networks:
      - viyan-network

    ports:
      - "5173:5173"

networks:
  viyan-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data: